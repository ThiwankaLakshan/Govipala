name: agrimachine_app
description: "Govipala (AgriMachine) Agricultural Machine Reservation App"
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core and Authentication for Phone OTP
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  
  # HTTP Client for communicating with the backend API
  http: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Local cache for offline mode (NFR-1 / FR-8.1)
  shared_preferences: ^2.2.2

  # Font icons and other layout helpers
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Register assets or custom fonts if needed
  # assets:
  #   - assets/images/
